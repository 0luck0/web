<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric.js 基础模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #26de81;
        }

        .control-item {
            margin-bottom: 10px;
        }

        .control-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .control-item input[type="range"] {
            width: 150px;
        }

        .btn {
            padding: 8px 16px;
            background: linear-gradient(90deg, #26de81, #00d4ff);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 12px;
            color: #a0a0a0;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        .title {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            text-align: right;
        }

        .title h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #26de81, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>Fabric.js</h1>
        <p>Canvas 交互库</p>
    </div>

    <div class="controls">
        <h3>控制面板</h3>
        <div class="control-item">
            <label>透明度: <span id="opacityValue">1</span></label>
            <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="1">
        </div>
        <button class="btn" id="addRectBtn">添加矩形</button>
        <button class="btn" id="addCircleBtn">添加圆形</button>
        <button class="btn" id="clearBtn">清空画布</button>
        <button class="btn" id="exportBtn">导出图片</button>
    </div>

    <div class="info">
        <p>Fabric.js v5 基础模板</p>
        <p>拖动/缩放/旋转形状</p>
    </div>

    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script>
        const canvas = new fabric.Canvas('canvas', {
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#1a1a2e',
        });

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        const rect = new fabric.Rect({
            left: centerX - 70,
            top: centerY - 40,
            width: 140,
            height: 80,
            fill: '#26de81',
            stroke: '#fff',
            strokeWidth: 2,
            rx: 10,
            ry: 10,
            selectable: true,
        });

        const circle = new fabric.Circle({
            left: centerX + 80,
            top: centerY - 40,
            radius: 40,
            fill: '#00d4ff',
            stroke: '#fff',
            strokeWidth: 2,
            selectable: true,
        });

        const triangle = new fabric.Triangle({
            left: centerX - 30,
            top: centerY + 50,
            width: 60,
            height: 60,
            fill: '#ffa500',
            stroke: '#fff',
            strokeWidth: 2,
            selectable: true,
        });

        const text = new fabric.Text('Fabric.js', {
            left: centerX - 60,
            top: centerY - 120,
            fill: '#fff',
            fontSize: 28,
            fontWeight: 'bold',
            stroke: '#26de81',
            strokeWidth: 2,
        });

        canvas.add(rect, circle, triangle, text);

        const colors = ['#26de81', '#00d4ff', '#ffa500', '#ff6b6b', '#a29bfe', '#fd79a8'];

        function addRectangle() {
            const rect = new fabric.Rect({
                left: Math.random() * (canvas.width - 100),
                top: Math.random() * (canvas.height - 100),
                width: 50 + Math.random() * 100,
                height: 50 + Math.random() * 100,
                fill: colors[Math.floor(Math.random() * colors.length)],
                stroke: '#fff',
                strokeWidth: 2,
                rx: 5,
                ry: 5,
                selectable: true,
            });
            canvas.add(rect);
        }

        function addCircle() {
            const circle = new fabric.Circle({
                left: Math.random() * (canvas.width - 100),
                top: Math.random() * (canvas.height - 100),
                radius: 20 + Math.random() * 40,
                fill: colors[Math.floor(Math.random() * colors.length)],
                stroke: '#fff',
                strokeWidth: 2,
                selectable: true,
            });
            canvas.add(circle);
        }

        function clearCanvas() {
            canvas.clear();
            canvas.backgroundColor = '#1a1a2e';
        }

        function exportCanvas() {
            const link = document.createElement('a');
            link.download = 'fabric-canvas.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        let opacity = 1;
        document.getElementById('opacity').addEventListener('input', function(e) {
            opacity = parseFloat(e.target.value);
            document.getElementById('opacityValue').textContent = e.target.value;

            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                activeObject.set('opacity', opacity);
                canvas.renderAll();
            }
        });

        canvas.on('selection:created', function() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                document.getElementById('opacityValue').textContent = activeObject.opacity;
                document.getElementById('opacity').value = activeObject.opacity;
            }
        });

        document.getElementById('addRectBtn').addEventListener('click', addRectangle);
        document.getElementById('addCircleBtn').addEventListener('click', addCircle);
        document.getElementById('clearBtn').addEventListener('click', clearCanvas);
        document.getElementById('exportBtn').addEventListener('click', exportCanvas);

        window.addEventListener('resize', function() {
            canvas.setWidth(window.innerWidth);
            canvas.setHeight(window.innerHeight);
            canvas.renderAll();
        });
    </script>
</body>
</html>
