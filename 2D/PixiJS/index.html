<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS 基础模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .control-item {
            margin-bottom: 10px;
        }

        .control-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .control-item input[type="range"] {
            width: 150px;
        }

        .btn {
            padding: 8px 16px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 12px;
            color: #a0a0a0;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        .title {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            text-align: right;
        }

        .title h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00d4ff, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>PixiJS</h1>
        <p>2D WebGL 渲染引擎</p>
    </div>

    <div class="controls">
        <h3>控制面板</h3>
        <div class="control-item">
            <label>旋转速度: <span id="rotationValue">0.02</span></label>
            <input type="range" id="rotationSpeed" min="0" max="0.1" step="0.01" value="0.02">
        </div>
        <div class="control-item">
            <label>缩放: <span id="scaleValue">1</span></label>
            <input type="range" id="scale" min="0.5" max="2" step="0.1" value="1">
        </div>
        <button class="btn" id="addStarBtn">添加星星</button>
        <button class="btn" id="clearStarsBtn">清空星星</button>
    </div>

    <div class="info">
        <p>PixiJS v8 基础模板</p>
        <p>点击画布添加粒子</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script>
        const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x1a1a2e,
            resolution: window.devicePixelRatio || 1,
            antialias: true,
        });

        document.body.appendChild(app.view);

        const container = new PIXI.Container();
        app.stage.addChild(container);

        const centerX = app.screen.width / 2;
        const centerY = app.screen.height / 2;

        const circle = new PIXI.Graphics();
        circle.beginFill(0x00d4ff, 0.3);
        circle.drawCircle(centerX, centerY, 80);
        circle.endFill();
        container.addChild(circle);

        const text = new PIXI.Text('PixiJS', {
            fontFamily: 'Arial',
            fontSize: 36,
            fontWeight: 'bold',
            fill: ['#00d4ff', '#ffa500'],
            stroke: '#fff',
            strokeThickness: 2,
        });
        text.x = centerX - text.width / 2;
        text.y = centerY - text.height / 2;
        container.addChild(text);

        const stars = [];

        function createStar(x, y) {
            const star = new PIXI.Graphics();
            const size = Math.random() * 20 + 10;
            const color = Math.floor(Math.random() * 0xffffff);

            star.beginFill(color, 0.8);
            star.drawStar(x, y, 5, size, size / 2);
            star.endFill();

            star.vx = (Math.random() - 0.5) * 2;
            star.vy = (Math.random() - 0.5) * 2;
            star.rotationSpeed = (Math.random() - 0.5) * 0.1;

            return star;
        }

        function addStar() {
            const star = createStar(
                Math.random() * app.screen.width,
                Math.random() * app.screen.height
            );
            stars.push(star);
            container.addChild(star);
        }

        function clearStars() {
            stars.forEach(star => container.removeChild(star));
            stars.length = 0;
        }

        for (let i = 0; i < 15; i++) {
            addStar();
        }

        const bgParticles = [];
        for (let i = 0; i < 50; i++) {
            const particle = new PIXI.Graphics();
            particle.beginFill(0xffffff, Math.random() * 0.5 + 0.1);
            particle.drawCircle(
                Math.random() * app.screen.width,
                Math.random() * app.screen.height,
                Math.random() * 2 + 1
            );
            particle.endFill();
            particle.speed = Math.random() * 0.5 + 0.2;
            bgParticles.push(particle);
            app.stage.addChild(particle);
        }

        let rotationSpeed = 0.02;
        let scale = 1;

        document.getElementById('rotationSpeed').addEventListener('input', (e) => {
            rotationSpeed = parseFloat(e.target.value);
            document.getElementById('rotationValue').textContent = e.target.value;
        });

        document.getElementById('scale').addEventListener('input', (e) => {
            scale = parseFloat(e.target.value);
            document.getElementById('scaleValue').textContent = e.target.value;
        });

        document.getElementById('addStarBtn').addEventListener('click', addStar);
        document.getElementById('clearStarsBtn').addEventListener('click', clearStars);

        app.view.addEventListener('click', (e) => {
            const rect = app.view.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const star = createStar(x, y);
            stars.push(star);
            container.addChild(star);
        });

        app.ticker.add(() => {
            container.rotation += rotationSpeed;
            container.scale.set(scale);

            stars.forEach(star => {
                star.x += star.vx;
                star.y += star.vy;
                star.rotation += star.rotationSpeed;

                if (star.x < 0 || star.x > app.screen.width) star.vx *= -1;
                if (star.y < 0 || star.y > app.screen.height) star.vy *= -1;
            });

            bgParticles.forEach(particle => {
                particle.y -= particle.speed;
                if (particle.y < -5) {
                    particle.y = app.screen.height + 5;
                    particle.x = Math.random() * app.screen.width;
                }
            });
        });

        window.addEventListener('resize', () => {
            app.renderer.resize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
