<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konva.js 基础模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #container {
            width: 100vw;
            height: 100vh;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #ff6b6b;
        }

        .control-item {
            margin-bottom: 10px;
        }

        .control-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .control-item input[type="range"] {
            width: 150px;
        }

        .btn {
            padding: 8px 16px;
            background: linear-gradient(90deg, #ff6b6b, #ffa500);
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 12px;
            color: #a0a0a0;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        .title {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            text-align: right;
        }

        .title h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>Konva.js</h1>
        <p>2D Canvas 动画框架</p>
    </div>

    <div class="controls">
        <h3>控制面板</h3>
        <div class="control-item">
            <label>动画速度: <span id="speedValue">1</span></label>
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        </div>
        <button class="btn" id="addShapeBtn">添加形状</button>
        <button class="btn" id="clearShapesBtn">清空形状</button>
        <button class="btn" id="groupShapesBtn">组合形状</button>
    </div>

    <div class="info">
        <p>Konva.js v9 基础模板</p>
        <p>拖动形状 | 点击选中</p>
    </div>

    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/konva/9.3.6/konva.min.js"></script>
    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;

        const stage = new Konva.Stage({
            container: 'container',
            width: width,
            height: height,
        });

        const layer = new Konva.Layer();
        stage.add(layer);

        const centerX = width / 2;
        const centerY = height / 2;

        const circle = new Konva.Circle({
            x: centerX - 50,
            y: centerY - 50,
            radius: 50,
            fill: '#ff6b6b',
            stroke: '#fff',
            strokeWidth: 2,
            draggable: true,
        });

        const rect = new Konva.Rect({
            x: centerX + 20,
            y: centerY - 40,
            width: 80,
            height: 80,
            fill: '#4ecdc4',
            stroke: '#fff',
            strokeWidth: 2,
            draggable: true,
            cornerRadius: 10,
        });

        const star = new Konva.Star({
            x: centerX,
            y: centerY + 50,
            numPoints: 5,
            innerRadius: 20,
            outerRadius: 40,
            fill: '#ffe66d',
            stroke: '#fff',
            strokeWidth: 2,
            draggable: true,
        });

        const text = new Konva.Text({
            x: centerX - 50,
            y: centerY - 100,
            text: 'Konva.js',
            fontSize: 24,
            fontFamily: 'Arial',
            fill: '#fff',
            stroke: '#ff6b6b',
            strokeWidth: 2,
        });

        layer.add(circle, rect, star, text);

        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#a29bfe'];
        const shapes = [];
        let shapeId = 0;

        function addShape() {
            const x = Math.random() * (width - 100) + 50;
            const y = Math.random() * (height - 100) + 50;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const type = Math.floor(Math.random() * 3);

            let shape;
            if (type === 0) {
                shape = new Konva.Circle({
                    x: x,
                    y: y,
                    radius: 20 + Math.random() * 20,
                    fill: color,
                    stroke: '#fff',
                    strokeWidth: 2,
                    draggable: true,
                    id: 'shape-' + shapeId++,
                });
            } else if (type === 1) {
                shape = new Konva.Rect({
                    x: x,
                    y: y,
                    width: 40 + Math.random() * 40,
                    height: 40 + Math.random() * 40,
                    fill: color,
                    stroke: '#fff',
                    strokeWidth: 2,
                    draggable: true,
                    cornerRadius: 5,
                    id: 'shape-' + shapeId++,
                });
            } else {
                shape = new Konva.Star({
                    x: x,
                    y: y,
                    numPoints: 5,
                    innerRadius: 15,
                    outerRadius: 30 + Math.random() * 20,
                    fill: color,
                    stroke: '#fff',
                    strokeWidth: 2,
                    draggable: true,
                    id: 'shape-' + shapeId++,
                });
            }

            shape.on('mouseenter', function () {
                this.scale({ x: 1.2, y: 1.2 });
                layer.batchDraw();
            });

            shape.on('mouseleave', function () {
                this.scale({ x: 1, y: 1 });
                layer.batchDraw();
            });

            shapes.push(shape);
            layer.add(shape);
            layer.batchDraw();
        }

        function clearShapes() {
            shapes.forEach(function(shape) {
                shape.destroy();
            });
            shapes.length = 0;
            layer.batchDraw();
        }

        function groupShapes() {
            if (shapes.length > 1) {
                const group = new Konva.Group({
                    draggable: true,
                });

                shapes.forEach(function(shape) {
                    group.add(shape.clone());
                    shape.destroy();
                });
                shapes.length = 0;
                layer.add(group);
                layer.batchDraw();
            }
        }

        document.getElementById('addShapeBtn').addEventListener('click', addShape);
        document.getElementById('clearShapesBtn').addEventListener('click', clearShapes);
        document.getElementById('groupShapesBtn').addEventListener('click', groupShapes);

        let speed = 1;
        document.getElementById('speed').addEventListener('input', function(e) {
            speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = e.target.value;
        });

        let angle = 0;
        const anim = new Konva.Animation(function(frame) {
            const time = frame.time * 0.001 * speed;
            angle += 0.02 * speed;

            circle.rotation(angle);
            rect.rotation(-angle);
            star.scale({
                x: 1 + Math.sin(time) * 0.1,
                y: 1 + Math.sin(time) * 0.1,
            });
        }, layer);

        anim.start();

        window.addEventListener('resize', function() {
            stage.width(window.innerWidth);
            stage.height(window.innerHeight);
        });
    </script>
</body>
</html>
