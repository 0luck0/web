<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 基础模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #00ff88;
        }

        .control-item {
            margin-bottom: 12px;
        }

        .control-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .control-item input[type="range"] {
            width: 150px;
        }

        .btn {
            padding: 8px 16px;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 12px;
            color: #a0a0a0;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .title {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            text-align: right;
        }

        .title h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff88;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">加载中...</div>

    <div class="title">
        <h1>Three.js</h1>
        <p>3D WebGL 渲染引擎</p>
    </div>

    <div class="controls">
        <h3>控制面板</h3>
        <div class="control-item">
            <label>旋转速度: <span id="rotationValue">1</span></label>
            <input type="range" id="rotationSpeed" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="control-item">
            <label>相机距离: <span id="cameraValue">15</span></label>
            <input type="range" id="cameraDistance" min="5" max="30" step="1" value="15">
        </div>
        <button class="btn" id="addCubeBtn">添加立方体</button>
        <button class="btn" id="clearCubesBtn">清空立方体</button>
    </div>

    <div class="info">
        <p>Three.js r158 基础模板</p>
        <p>拖动旋转视角 | 滚轮缩放</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0x00ff88, 1, 100);
        pointLight.position.set(-10, 5, 10);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0x00d4ff, 1, 100);
        pointLight2.position.set(10, -5, -10);
        scene.add(pointLight2);

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshPhongMaterial({
            color: 0x00ff88,
            shininess: 100,
            specular: 0x444444,
        });
        const cube = new THREE.Mesh(geometry, material);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        const edgeGeometry = new THREE.EdgesGeometry(geometry);
        const edges = new THREE.LineSegments(
            edgeGeometry,
            new THREE.LineBasicMaterial({ color: 0x00d4ff })
        );
        cube.add(edges);

        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(0, 3, 0);
        scene.add(sphere);

        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x333333);
        scene.add(gridHelper);

        const cubes = [];

        function addCube() {
            const geo = new THREE.BoxGeometry(
                Math.random() * 2 + 0.5,
                Math.random() * 2 + 0.5,
                Math.random() * 2 + 0.5
            );
            const mat = new THREE.MeshPhongMaterial({
                color: Math.random() * 0xffffff,
                shininess: 50,
            });
            const newCube = new THREE.Mesh(geo, mat);
            newCube.position.set(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 15
            );
            newCube.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            newCube.castShadow = true;
            newCube.receiveShadow = true;
            newCube.userData = {
                rotationSpeed: (Math.random() - 0.5) * 0.02,
            };
            cubes.push(newCube);
            scene.add(newCube);
        }

        function clearCubes() {
            cubes.forEach(function(cubeItem) {
                scene.remove(cubeItem);
                cubeItem.geometry.dispose();
                cubeItem.material.dispose();
            });
            cubes.length = 0;
        }

        for (let i = 0; i < 5; i++) {
            addCube();
        }

        document.getElementById('addCubeBtn').addEventListener('click', addCube);
        document.getElementById('clearCubesBtn').addEventListener('click', clearCubes);

        let rotationSpeed = 1;
        let cameraDistance = 15;

        document.getElementById('rotationSpeed').addEventListener('input', function(e) {
            rotationSpeed = parseFloat(e.target.value);
            document.getElementById('rotationValue').textContent = e.target.value;
        });

        document.getElementById('cameraDistance').addEventListener('input', function(e) {
            cameraDistance = parseFloat(e.target.value);
            document.getElementById('cameraValue').textContent = e.target.value;
        });

        function animate() {
            requestAnimationFrame(animate);

            cube.rotation.x += 0.01 * rotationSpeed;
            cube.rotation.y += 0.015 * rotationSpeed;

            sphere.position.y = 3 + Math.sin(Date.now() * 0.002) * 0.5;

            cubes.forEach(function(cubeItem) {
                cubeItem.rotation.x += cubeItem.userData.rotationSpeed * rotationSpeed;
                cubeItem.rotation.y += cubeItem.userData.rotationSpeed * rotationSpeed * 1.5;
            });

            const targetZ = cameraDistance;
            camera.position.z += (targetZ - camera.position.z) * 0.05;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('loading').style.display = 'none';
    </script>
</body>
</html>
